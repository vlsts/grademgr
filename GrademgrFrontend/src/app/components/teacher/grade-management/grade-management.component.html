<div class="dashboard">
    <header>
        <h1>Grade Management</h1>
        <button (click)="navigateBack()">Back to Dashboard</button>
    </header>
    
    <main>
        <div class="course-selection">
            <h2>Select a Course</h2>
            <div class="select-container">
                <select [(ngModel)]="selectedCourseId" (change)="onCourseChange()">
                    <option [value]="null" disabled selected>Choose a course</option>
                    <option *ngFor="let course of courses" [value]="course.id">{{ course.courseCode }}</option>
                </select>
            </div>
        </div>
        
        <div *ngIf="selectedCourseId" class="grades-container">
            <!-- Add Grade Card -->
            <div class="card add-grade-card">
                <div class="card-header">
                    <h3>Add New Grade</h3>
                </div>
                
                <form (ngSubmit)="submitGrade()" class="grade-form">
                    <div class="form-group">
                        <label for="studentEmail">Student Email:</label>
                        <input 
                            type="email" 
                            id="studentEmail" 
                            name="studentEmail" 
                            [(ngModel)]="newGrade.studentEmail" 
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="assignmentName">Assignment Name:</label>
                        <input 
                            type="text" 
                            id="assignmentName" 
                            name="assignmentName" 
                            [(ngModel)]="newGrade.assignmentName" 
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="grade">Grade:</label>
                        <input 
                            type="number" 
                            id="grade" 
                            name="grade" 
                            [(ngModel)]="newGrade.grade" 
                            min="1" 
                            max="10" 
                            step="0.1"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="comment">Comment (optional):</label>
                        <textarea 
                            id="comment" 
                            name="comment" 
                            [(ngModel)]="newGrade.comment"
                            rows="3"
                        ></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="submit-button" [disabled]="!newGrade.studentEmail || !newGrade.grade || !newGrade.assignmentName">Add Grade</button>
                    </div>
                </form>
            </div>

            <!-- All Grades Card -->
            <div class="card grades-card">
                <h3>All Grades</h3>
                
                <div class="search-container">
                    <input 
                        type="text" 
                        placeholder="Search by name or email" 
                        (keyup)="applyFilter($event)"
                        class="search-input"
                    >
                    <span class="search-icon">🔍</span>
                </div>
                
                <div class="table-container">
                    <table class="grades-table">
                        <thead>
                            <tr>
                                <th (click)="sort('name')">Student</th>
                                <th (click)="sort('email')">Email</th>
                                <th (click)="sort('assignment')">Assignment</th>
                                <th (click)="sort('grade')">Grade</th>
                                <th (click)="sort('date')">Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let grade of filteredGrades">
                                <td>{{grade.studentName}}</td>
                                <td>{{grade.studentEmail}}</td>
                                <td>{{grade.assignmentName}}</td>
                                <td>{{grade.gradeValue}}</td>
                                <td>{{grade.enteredAt | date:'short'}}</td>
                                <td class="actions">
                                    <button class="icon-button delete" (click)="deleteGrade(grade.id)" title="Delete Grade">🗑️</button>
                                </td>
                            </tr>
                            <tr *ngIf="filteredGrades.length === 0">
                                <td colspan="6" class="no-data">No grades available</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination">
                    <button (click)="prevPage()" [disabled]="currentPage === 0">Previous</button>
                    <span>Page {{currentPage + 1}} of {{totalPages}}</span>
                    <button (click)="nextPage()" [disabled]="currentPage === totalPages - 1">Next</button>
                </div>
            </div>
        </div>
    </main>
</div>
