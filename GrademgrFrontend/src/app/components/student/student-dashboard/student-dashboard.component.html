<div class="dashboard">
    <header>
      <h1>Student Dashboard</h1>
      <button (click)="logout()">Logout</button>
    </header>
    
    <main>
      <section class="dashboard-content">
        <h2>Welcome, Student!</h2>
        <p>This is your student dashboard where you can view your courses and grades.</p>
        
        <div class="action-cards">
          <div class="card">
            <h3>My Courses</h3>
            <p>View all courses you're enrolled in</p>
            <button>View Courses</button>
          </div>
          
          <div class="card">
            <h3>My Grades</h3>
            <p>Check your grades for all courses</p>
            <button>View Grades</button>
          </div>
        </div>
      </section>
    </main>
  </div>
