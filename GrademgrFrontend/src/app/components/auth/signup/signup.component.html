<div class="signup-container">
    <h2>Sign Up</h2>
    
    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
    
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          formControlName="username">
        <div *ngIf="submitted && f['username'].errors" class="validation-error">
          <div *ngIf="f['username'].errors['required']">Username is required</div>
        </div>
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email">
        <div *ngIf="submitted && f['email'].errors" class="validation-error">
          <div *ngIf="f['email'].errors['required']">Email is required</div>
          <div *ngIf="f['email'].errors['email']">Invalid email format</div>
        </div>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password">
        <div *ngIf="submitted && f['password'].errors" class="validation-error">
          <div *ngIf="f['password'].errors['required']">Password is required</div>
          <div *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</div>
        </div>
      </div>
      
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input 
          type="text" 
          id="fullName" 
          formControlName="fullName">
        <div *ngIf="submitted && f['fullName'].errors" class="validation-error">
          <div *ngIf="f['fullName'].errors['required']">Full Name is required</div>
        </div>
      </div>
      
      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" formControlName="role">
          <option value="1">Student</option>
          <option value="2">Teacher</option>
        </select>
        <div *ngIf="submitted && f['role'].errors" class="validation-error">
          <div *ngIf="f['role'].errors['required']">Role is required</div>
        </div>
      </div>
      
      <button type="submit" [disabled]="signupForm.invalid">Sign Up</button>
    </form>
</div>
