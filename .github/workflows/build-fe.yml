name: Check Build FE
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
        
            - name: Set up Node.js
              uses: actions/setup-node@v4.3.0
              with:
                node-version: '22'

            - name: Set up bun.js
              uses: oven-sh/setup-bun@v2.0.1

            - name: Install dependencies  
              run: bun i
              working-directory: ./GrademgrFrontend
            
            - name: Build project
              run: bun run build
              working-directory: ./GrademgrFrontend
            
            - name: Run tests
              run: bun run test
              working-directory: ./GrademgrFrontend
            
