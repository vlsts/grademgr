services:
  frontend:
    build:
      context: ./GrademgrFrontend
      dockerfile: dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - backend
  backend:
    build:
      context: ./GrademgrBackend
      dockerfile: dockerfile
    ports:
      - "5052:5052"
    depends_on:
      - mongo
  mongo:
    image: mongo:latest
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8082:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongo
